services:

  postgres:

    image: postgres:17

    container_name: nest-pet-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: password

      POSTGRES_DB: nest_pet

    ports:

      - "5432:5432"

    volumes:

      - postgres-data:/var/lib/postgresql/data

volumes:

  postgres-data: